<!DOCTYPE html>
<html lang="zh-cmn-Hans" xmlns:th="http://www.thymeleaf.org"
	  xmlns:shiro="http://www.eryansky.com/thymeleaf/shiro"
	  xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator">
<head>
	<title>登录统计</title>
	<th:block th:replace="~{include/meta :: meta}"></th:block>
	<script type="text/javascript" th:inline="javascript">
		/*<![CDATA[*/
		var $log_datagrid;
		var $log_search_form;
		$(function () {
			$log_search_form = $('#log_search_form').form();
			//数据列表
			$log_datagrid = $('#log_datagrid').datagrid({
				url: ctxAdmin+'/sys/log/report/loginStatisticsData',
				fit:true,
				pagination: true,//底部分页
				rownumbers: true,//显示行数
				fitColumns: false,//自适应列宽
				striped: true,//显示条纹
				pageSize: 20,//每页记录数
				pageList: [10, 20, 50, 100, 1000, 99999],
				singleSelect: false,//单选模式
				remoteSort: false,//是否通过远程服务器对数据排序
				checkbox: true,
				nowrap: true,
				border: false,
				showFooter: true,
				//idField: 'id',
				columns: [ [
					{field: 'userId', title: '用户标识', width: 260, hidden: false},
					{field: 'userName', title: '姓名', width: 100},
					{field: 'userLoginName', title: '账号', width: 120, hidden: false},
					{field: 'count', title: '登录次数', width: 100,align:'right', hidden: false, sortable: true}
				]]
			}).datagrid("showTooltip");

		});

		//搜索
		function search() {
			$log_datagrid.datagrid('load', $.serializeObject($log_search_form));
		}

		//导出excle表格
		function exportExcel(){
			var query =  document.getElementById("query").value;
			var startTime =  document.getElementById("startTime").value;
			var endTime =  document.getElementById("endTime").value;
			$('#login_temp_iframe').attr('src', ctxAdmin+'/sys/log/report/loginStatisticsExportExcel?query='+query+'&startTime='+startTime+'&endTime='+endTime);
		}
		/*]]>*/
	</script>
</head>
<body>
<div class="easyui-layout" fit="true" style="margin: 0px;border: 0px;overflow: hidden;width:100%;height:100%;">
	<div data-options="region:'north',title:'过滤条件',collapsed:false,split:false,border:false"
		 style="padding: 0px; height: 70px;width:100%; overflow-y: hidden;">
		<form id="log_search_form" style="padding: 5px;">

			&nbsp;关键字：<input type="text" id="query" name="query"
								class="easyui-validatebox textbox eu-input" placeholder="用户信息..."  onkeydown="if(event.keyCode==13)search()"
								maxLength="36" style="width: 160px" />
			&nbsp;起始时间：<input type="text" id="startTime" name="startTime" class="easyui-my97" placeholder="起始时间..."/>
			&nbsp;结束时间：<input type="text" id="endTime" name="endTime" class="easyui-my97"  placeholder="结束时间..."/>
			&nbsp;<a class="easyui-linkbutton" href="#" data-options="iconCls:'easyui-icon-search',width:100,height:28, onClick:search">查询</a>
			<a class="easyui-linkbutton" href="#" data-options="iconCls:'easyui-icon-no',width:100,height:28" onclick="$log_search_form.form('reset');">重置</a>
			<a href="#" class="easyui-linkbutton" id="exportExcel" data-options="iconCls:'easyui-icon-search',width:100,height:28, onClick:exportExcel">导出</a>
		</form>
	</div>

	<div data-options="region:'center',split:false,border:false"
		 style="padding: 0px; height: 100%;width:100%; overflow-y: hidden;">
		<table id="log_datagrid"></table>
	</div>

	<iframe id="login_temp_iframe" style="display: none;"></iframe>
</div>
</body>
</html>
