<!DOCTYPE html>
<html lang="zh-cmn-Hans" xmlns:th="http://www.thymeleaf.org"
	  xmlns:shiro="http://www.eryansky.com/thymeleaf/shiro"
	  xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator">
<head>
	<title>区域管理</title>
	<!-- 装饰器配置 (沿用 SiteMesh) -->
	<meta name="decorator" content="default_sys"/>
	<th:block th:replace="~{include/treetable :: treetable}"></th:block>
	<script type="text/javascript" th:inline="javascript">
		/*<![CDATA[*/
		var data = JSON.parse(/*[[${T(com.eryansky.utils.AppUtils).toJson(list)}]]*/ {});
		var rootId = /*[[${rootId}]]*/ {};
		$(document).ready(function() {
			var tpl = $("#treeTableTpl").html().replace(/(\/\/\<!\-\-)|(\/\/\-\->)/g,"");

			addRow("#treeTableList", tpl, data, rootId, true);
			$("#treeTable").treeTable({expandLevel : 3});
		});
		function addRow(list, tpl, data, pid, root){
			for (var i=0; i<data.length; i++){
				var row = data[i];
				if (row['parentId'] == pid){
					$(list).append(Mustache.render(tpl, {pid: (root?0:pid), row: row}));
					addRow(list, tpl, data, row.id);
				}
			}
		}
		/*]]>*/
	</script>
</head>
<body>
	<ul class="nav nav-tabs">
		<li class="active"><a th:href="${ctxAdmin}+'/sys/area'">区域列表</a></li>
		<shiro:hasPermission name="sys:area:edit"><li><a th:href="${ctxAdmin}+'/sys/area/form'">区域添加</a></li></shiro:hasPermission>
	</ul>
	<div th:replace="~{common/tags/message :: messageBox(content=${message})}"></div>
	<table id="treeTable" class="table table-striped table-bordered table-condensed">
		<thead><tr>
			<th>区域名称</th>
			<th>区域编码</th>
			<th>信息分类编码</th>
			<th>区域类型</th>
			<th>备注</th>
			<th>更新时间</th>
			<shiro:hasPermission name="sys:area:edit"><th>操作</th></shiro:hasPermission></tr>
		</thead>
		<tbody id="treeTableList"></tbody>
	</table>
	<script type="text/template" id="treeTableTpl">
		<tr id="{{row.id}}" pId="{{pid}}">
			<td><a th:href="${ctxAdmin}+'/sys/area?parent.id={{row.id}}'">{{row.name}}</a></td>
			<td>{{row.code}}</td>
			<td>{{row.bizCode}}</td>
			<td>{{row.typeView}}</td>
			<td>{{row.remark}}</td>
			<td>{{row.updateTime}}</td>
			<shiro:hasPermission name="sys:area:edit"><td>
				<a th:href="${ctxAdmin}+'/sys/area/form?id={{row.id}}'">修改</a>
				<a th:href="${ctxAdmin}+'/sys/area/delete?id={{row.id}}'" onclick="return confirmx('要删除该区域吗？', this.href)">删除</a>
				<a th:href="${ctxAdmin}+'/sys/area/deleteOwnerAndChilds?id={{row.id}}'" onclick="return confirmx('要删除该区域及所有子区域项吗？', this.href)" style="color: red;">级联删除</a>
				<a th:href="${ctxAdmin}+'/sys/area/form?parent.id={{row.id}}'">添加下级区域</a>
			</td></shiro:hasPermission>
		</tr>
	</script>
</body>
</html>
