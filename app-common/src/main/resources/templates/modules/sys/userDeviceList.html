<!DOCTYPE html>
<html lang="zh-cmn-Hans" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.eryansky.com/thymeleaf/shiro"
      xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator">
<head>
    <title>用户设备管理</title>
    <!-- 装饰器配置 (沿用 SiteMesh) -->
    <meta name="decorator" content="default_sys"/>
    <link th:href="${ctxStatic}+'/js/toastr/toastr.min.css'" type="text/css" rel="stylesheet" />
    <script th:src="${ctxStatic}+'/js/toastr/toastr.min.js'" type="text/javascript"></script>
    <!-- bootstrap条件框的收缩和展开 -->
    <link rel="stylesheet" th:href="${ctxStatic}+'/app/modules/sys/css/bootstrap_query_fold.min.css'">
    <script type="text/javascript" th:inline="javascript">
        /*<![CDATA[*/
        $(function(){
            loadData();
            $("#btnSubmit").click(function(){
                $("#pageNo").val(1);
                loadData();
            });

            $("#btnReset").click(function(){
                $('#searchForm').find("input[type=text]").val("");
                $('#searchForm').find("select").val(null).trigger("change");
            });

            $("#btnExport").click(function(){
                var param = $.serializeObject($("#searchForm"));
                $('#annexFrame').attr('src', ctxAdmin + '/sys/userDevice/list?export=true&'+ $.param(param));
            });
        });

        function loadData(){
            var queryParam = $.serializeObject($("#searchForm"));
            $("#btnSubmit").attr("disabled",true);
            $.ajax({
                url: ctxAdmin + '/sys/userDevice/list',
                type: 'post',
                dataType: "json",
                cache:false,
                data:queryParam,
                beforeSend: function (jqXHR, settings) {
                    $("#list").html("<div style='padding: 10px 30px;text-align:center;font-size: 16px;'><img src='"+ctxStatic+"/js/easyui/themes/bootstrap/images/loading.gif' />数据加载中...</div>");
                },
                success: function (data) {
                    $("#btnSubmit").attr("disabled",false);
                    if (data['totalCount'] > 0) {
                        var html = Mustache.render($("#list_template").html(), data);
                        $("#list").html(html);
                        $(".pagination").append(data['html']);
                    } else {
                        $("#list").html("<div style='color: red;padding: 10px 30px;text-align:center;font-size: 16px;'>查无数据</div>");
                    }
                }
            });
        }

        function page(n,s){
            $("#pageNo").val(n);
            $("#pageSize").val(s);
            loadData();
            return false;
        }
        /*]]>*/
    </script>

    <!-- Mustache 前端模板 -->
    <script type="text/template" id="list_template">
        <table id="contentTable" class="table table-striped table-bordered table-condensed">
            <thead>
            <tr>
                <th>应用ID</th>
                <th>用户ID</th>
                <th>用户信息</th>
                <th>设备标识</th>
                <th>设备类型</th>
                <th>设备名称</th>
                <th>登录IP</th>
                <th>最近登录位置</th>
                <th>登录次数</th>
                <th>首次登录时间</th>
                <th>最后登录时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            {{#result}}
            <tr>
                <td>{{appId}}</td>
                <td>{{userId}}</td>
                <td>【{{userTypeView}}】{{userName}}</td>
                <td>{{deviceId}}</td>
                <td>{{deviceTypeView}}</td>
                <td>{{deviceName}}</td>
                <td>{{ips}}</td>
                <td>{{location}}</td>
                <td>{{loginCount}}</td>
                <td>{{firstLoginTime}}</td>
                <td>{{lastLoginTime}}</td>
                <td>
                    <shiro:hasPermission name="sys:userDevice:edit">
                        <a th:href="${ctxAdmin}+'/sys/userDevice/delete?id={{id}}'" onclick="return confirmx('要删除该数据吗？', this.href)">删除</a>
                    </shiro:hasPermission>
                </td>
            </tr>
            {{/result}}
            </tbody>
        </table>
        <div class="page pagination"></div>
    </script>
</head>
<body>
<ul class="nav nav-tabs">
    <li class="active"><a th:href="${ctxAdmin} + '/sys/userDevice'">用户设备列表</a></li>
</ul>
<div class="accordion" id="form_accordion">
    <div class="accordion-group">
        <div class="accordion-heading">
            <a class="accordion-toggle" data-toggle="collapse" data-parent="#form_accordion" href="#collapseOne">
                <i class="icon-filter"></i>
            </a>
        </div>
        <div id="collapseOne" class="accordion-body collapse in">
            <div class="accordion-inner">
                <form id="searchForm">
                    <input id="pageNo" name="pageNo" type="hidden" value="1"/>
                    <input id="pageSize" name="pageSize" type="hidden" value="20"/>
                    <input name="status" type="hidden" value="0"/>
                    <div class="row-fluid">
                        <div class="span6">
                            <div class="span3"><label>关键字：</label></div>
                            <div class="span9">
                                <input name="query" type="text" th:value="${model.query}" class="input-xlarge" placeholder="APP / 用户 / 设备 / IP / 位置" /></div>
                        </div>
                        <div class="span6">
                            <div class="span3"><label>设备类型：</label></div>
                            <div class="span9">
                                <select name="deviceType" id="deviceType" class="selectStyle" >
                                    <option value="">全部</option>
                                    <option th:each="item : ${deviceTypes}"
                                            th:value="${item.value}"
                                            th:text="${item.description}"
                                            th:selected="${item.value eq model.deviceType}">
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row-fluid">
                        <div class="span6">
                            <div class="span3"><label>最后登录时间：</label></div>
                            <div class="span9">
                                <input id="beginLastLoginTime" name="beginLastLoginTime" type="text" readonly="readonly" maxlength="20" class="input-small Wdate"
                                       th:value="${beginLastLoginTime}" onclick="WdatePicker({dateFmt:'yyyy-MM-dd',isShowClear:true});"/>
                                &nbsp;至&nbsp;
                                <input id="endLastLoginTime" name="endLastLoginTime" type="text" readonly="readonly" maxlength="20" class="input-small Wdate"
                                       th:value="${endLastLoginTime}" onclick="WdatePicker({dateFmt:'yyyy-MM-dd',isShowClear:true});"/>
                            </div>
                        </div>
                        <div class="span6">
                            <div class="span3"></div>
                            <div class="span9">
                                <input id="btnSubmit" class="btn btn-primary" type="button" value="查 询"/>&nbsp;&nbsp;
                                <input id="btnReset" class="btn btn-warning" type="reset" value="重 置"/>&nbsp;&nbsp;
                                <button id="btnExport" type="button" class="btn btn-primary">导 出</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{common/tags/message :: messageBox(content=${message})}"></div>
<div id="list"></div>
<iframe id="annexFrame" src="" frameborder="no" style="padding: 0;border: 0;width: 100%;height: 50px;display: none;"></iframe>
</body>
</html>
