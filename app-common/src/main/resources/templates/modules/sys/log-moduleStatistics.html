<!DOCTYPE html>
<html lang="zh-cmn-Hans" xmlns:th="http://www.thymeleaf.org"
	  xmlns:shiro="http://www.eryansky.com/thymeleaf/shiro"
	  xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator">
<head>
	<title>模块访问统计</title>
	<!-- 装饰器配置 (沿用 SiteMesh) -->
	<meta name="decorator" content="default_sys"/>
	<!-- bootstrap条件框的收缩和展开 -->
	<link rel="stylesheet" th:href="${ctxStatic}+'/app/modules/sys/css/bootstrap_query_fold.min.css'">
	<script type="text/javascript" th:inline="javascript">
		/*<![CDATA[*/
		$(function(){
			$("#organIdId").change(function(){
				if($("#organIdId").val()){
					$("#userIdId").val('');
					$("#userIdName").val('');
					userIdSetAjaxURL(ctxAdmin+"/sys/user/organUserTree?parentId="+$("#organIdId").val())
				}
			});

			$("#onlyCompany").change(function(){
				if($("#onlyCompany").prop('checked')){
					$("#userIdId").val('');
					$("#userIdName").val('');
				}
			});
		});
		function page(n,s){
			$("#pageNo").val(n);
			$("#pageSize").val(s);
			$("#searchForm").submit();
		}

		//导出excel表格
		function exportExcel(){
			var param = $.serializeObject($("#searchForm"));
			param['userId'] = $("#userIdId").val();
			param['organId'] = $("#organIdId").val();
			$('#module_temp_iframe').attr('src', ctxAdmin+'/sys/log/report/moduleStatisticsExportExcel?'+ $.param(param));
		}
		/*]]>*/
	</script>
</head>
<body>
<ul class="nav nav-tabs">
	<li class="active"><a th:href="${ctxAdmin}+'/sys/log/report/moduleStatistics'">模块访问统计</a></li>
</ul>
<form id="searchForm" modelAttribute="paramMap" th:action="${ctxAdmin}+'/sys/log/report/moduleStatistics'" method="post" class="breadcrumb form-search">

	<div>
		<label>机构选择：</label>

		<th:block th:replace="~{common/tags/treeselect :: treeselect(
					id='organId',
					name='organId',
					value=${paramMap.organId},
					labelName='organName',
					labelValue=${paramMap.organName},
					title='机构',
					url=${ctxAdmin + '/sys/organ/ownerAndChildsCompanysData'},
					allowClear=true
				)}"></th:block>
		<label><input type="checkbox" id="onlyCompany" name="onlyCompany" value="true" th:checked="${paramMap.onlyCompany}" >本级</label>

		<label>人员选择：</label>
		<th:block th:replace="~{common/tags/treeselect :: treeselect(
					id='userId',
					name='userId',
					value=${paramMap.userId},
					labelName='userName',
					labelValue=${paramMap.userName},
					title='人员',
					url=${ctxAdmin + '/sys/user/organUserTree'},
					notAllowSelectParent=true,
					notAllowSelectRoot=true,
					allowClear=true,
					cssClass='required'
				)}"></th:block>

		<label>开始日期：</label><input id="startTime" name="startTime" type="text" readonly="readonly" maxlength="20" class="input-small Wdate"
									   th:value="${paramMap.startTime}" onclick="WdatePicker({dateFmt:'yyyy-MM-dd',isShowClear:true});"/>
		<label>结束日期：</label><input id="endTime" name="endTime" type="text" readonly="readonly" maxlength="20" class="input-small Wdate"
									   th:value="${paramMap.endTime}" onclick="WdatePicker({dateFmt:'yyyy-MM-dd',isShowClear:true});"/>&nbsp;&nbsp;
		<input id="btnSubmit" class="btn btn-primary" type="submit" value="查询"/>
		<button type="button" class="btn btn-primary" onclick="exportExcel();">导出</button>
		<input id="pageNo" name="pageNo" type="hidden" value="${page.pageNo}"/>
		<input id="pageSize" name="pageSize" type="hidden" value="${page.pageSize}"/>
	</div>
</form>
<div th:replace="~{common/tags/message :: messageBox(content=${message})}"></div>
<table id="contentTable" class="table table-striped table-bordered table-condensed">
	<thead><tr><th>模块</th><th>请求次数</th>
	<tbody>
		<tr th:each="m : ${page.result}">
			<td th:text="${m.module}"></td>
			<td th:text="${m.moduleCount}"></td>
		</tr>
	</tbody>
</table>
<div class="pagination" th:utext="${page}"></div>
<iframe id="module_temp_iframe" style="display: none;"></iframe>
</body>
</html>
