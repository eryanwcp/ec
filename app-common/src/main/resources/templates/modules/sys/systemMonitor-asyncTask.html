<!DOCTYPE html>
<html lang="zh-cmn-Hans" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.eryansky.com/thymeleaf/shiro"
      xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator">
<head>
    <title>系统监控-异步任务</title>
    <!-- 装饰器配置 (沿用 SiteMesh) -->
    <meta name="decorator" content="default_sys"/>
    <script type="text/javascript" th:inline="javascript">
        /*<![CDATA[*/
        $(function(){
            reLoad();
        });
        function reLoad(){
            var queryParam = $.serializeObject($("#searchForm"));
            $.ajax({
                url: ctxAdmin + '/sys/systemMonitor/asyncTask',
                type: 'post',
                dataType: "json",
                cache:false,
                data:queryParam,
                beforeSend: function (jqXHR, settings) {
                    $("#list").html("<div style='padding: 10px 30px;text-align:center;font-size: 16px;'><img src='"+ctxStatic+"/js/easyui/themes/bootstrap/images/loading.gif' />数据加载中...</div>");
                },
                success: function (data) {
                    if (data.code === 1) {
                        var html = Mustache.render($("#list_template").html(),data['data']);
                        $("#list").html(html);
                    } else {
                        $("#list").html(data['msg'] || "加载异常");
                    }
                }
            });
        }
        /*]]>*/
    </script>

    <!-- Mustache 前端模板语法保持不变 -->
    <script type="text/template" id="list_template">
        <table class="table table-striped table-bordered table-condensed">
            <tbody>
            <tr>
                <td>默认线程数</td>
                <td> {{corePoolSize}}</td>
            </tr>
            <tr>
                <td>最大线程数</td>
                <td style="color: red;"> {{maxPoolSize}}</td>
            </tr>
            <tr>
                <td>执行中线程数</td>
                <td style="color: red;">{{activeCount}}</td>
            </tr>
            <tr>
                <td>待执行队列数</td>
                <td>{{queueSize}}</td>
            </tr>
            <tr>
                <td>提交任务数</td>
                <td>{{taskCount}}</td>
            </tr>
            <tr>
                <td>完成任务数</td>
                <td>{{completedTaskCount}}</td>
            </tr>
            <tr>
                <td>可用队列长度</td>
                <td style="color: green;"> {{queueRemainingCapacity}}</td>
            </tr>
            </tbody>
        </table>
    </script>
</head>
<body>
<ul class="nav nav-tabs">
    <li><a th:href="${ctxAdmin} + '/sys/systemMonitor'">系统监控</a></li>
    <li><a th:href="${ctxAdmin} + '/sys/systemMonitor/log'">系统日志</a></li>
    <li><a th:href="${ctxAdmin} + '/sys/systemMonitor/sessionCache'">会话监控</a></li>
    <li><a th:href="${ctxAdmin} + '/sys/systemMonitor/cache'">缓存管理</a></li>
    <li><a th:href="${ctxAdmin} + '/sys/systemMonitor/queue'">队列管理</a></li>
    <li class="active"><a th:href="${ctxAdmin} + '/sys/systemMonitor/asyncTask'">异步任务</a></li>
    <li><a th:href="${ctxAdmin} + '/sys/job'">调度任务</a></li>
</ul>
<form id="searchForm" method="post" class="breadcrumb form-search">
    <input id="btnSubmit" class="btn btn-primary" type="button" value="刷新" onclick="reLoad();"/>&nbsp;&nbsp;
</form>
<div th:replace="~{common/tags/message :: messageBox(content=${message})}"></div>
<div id="list"></div>
</body>
</html>
