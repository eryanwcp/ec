<!DOCTYPE html>
<html lang="zh-cmn-Hans" xmlns:th="http://www.thymeleaf.org"
      xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
      class="no-js">
<head>
    <title><sitemesh:write property="title"/> - [[${T(com.eryansky.utils.AppConstants).getAppName()}]]</title>
    <meta name="viewport" id="viewport" content="width=device-width, initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">

    <th:block th:replace="~{modules/sys/include/head_mobile :: head_mobile}"></th:block>
    <th:block th:replace="~{include/mobile-select-area :: mobile-select-area}"></th:block>
    <th:block th:replace="~{include/dialog :: dialog}"></th:block>

    <script type="text/javascript" charset="utf-8" th:src="${ctxStatic} + '/mobile/map_module.min.js?_='+${sysInitTime}"></script>
    <link rel="stylesheet" type="text/css" th:href="${ctxStatic} + '/app/mobile/mobile.min.css?_='+${sysInitTime}" />

    <!-- SiteMesh head 写入注入点 -->
    <sitemesh:write property="head"/>
</head>
<body>
<!-- SiteMesh body 写入注入点 -->
<sitemesh:write property="body"/>
</body>
</html>
