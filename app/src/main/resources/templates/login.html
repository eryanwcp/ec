<!DOCTYPE html>
<html lang="zh-cmn-Hans" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.eryansky.com/thymeleaf/shiro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=EDGE;chrome=1" />
    <meta name="renderer" content="webkit" />
    <link rel="shortcut icon" href="/static/img/favicon.ico" th:href="@{/static/img/favicon.ico}" />
    <title>[[${T(com.eryansky.utils.AppConstants).getAppFullName()}]] - 登录</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0284c7 100%);
            color: #333;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态背景装饰 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(59, 130, 246, 0.2));
            filter: blur(60px);
            z-index: 1;
        }
        .bg-circle-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }
        .bg-circle-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -100px;
        }

        /* 顶部标题栏 */
        .header {
            margin-top: 40px;
            text-align: center;
            z-index: 2;
        }
        .header h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .header p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* 单栏登录卡片容器 */
        .login-card {
            width: 420px;
            max-width: 90vw;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.3), 0 10px 15px -6px rgba(0, 0, 0, 0.2);
            z-index: 2;
            margin: 20px 0;
            overflow: hidden;
        }

        /* 表单区域 */
        .login-right-panel {
            padding: 36px 36px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Tabs 切换 */
        .account-tabs {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 24px;
        }
        .account-tab-btn {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s ease;
        }
        .account-tab-btn.active {
            color: #0284c7;
            border-bottom-color: #0284c7;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        .input-group input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }
        .input-group input:focus {
            border-color: #0284c7;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .sms-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .sms-input-wrapper input {
            flex: 1;
        }
        .send-sms-btn {
            width: 110px;
            height: 44px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .send-sms-btn:hover:not(:disabled) {
            background: #e2e8f0;
        }
        .send-sms-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .submit-btn {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            margin-top: 6px;
        }
        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* 底部版权信息 */
        .footer {
            margin-bottom: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            z-index: 2;
            line-height: 1.6;
        }
        .footer a {
            color: #cbd5e1;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer a:hover {
            color: #fff;
        }

        /* 自定义 Toast 消息提示组件 */
        .toast-container {
            position: fixed;
            top: 124px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast-item {
            min-width: 300px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }
        .toast-item.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
        }
        .toast-info .toast-icon { background-color: #0284c7; }
        .toast-success .toast-icon { background-color: #10b981; }
        .toast-warning .toast-icon { background-color: #f59e0b; }
        .toast-error .toast-icon { background-color: #ef4444; }

        @media (max-width: 768px) {
            .login-card { width: 90%; }
            .login-right-panel { padding: 24px; }
        }
    </style>
</head>
<body>
<div class="bg-circle bg-circle-1"></div>
<div class="bg-circle bg-circle-2"></div>

<header class="header">
    <h1>
        <img th:src="@{/static/img/logo.png}" alt="logo" width="36" height="36" />
        [[${T(com.eryansky.utils.AppConstants).getAppFullName()}]]统一身份验证
    </h1>
    <p>Enterprise Unified Portal Access System</p>
</header>

<!-- 消息提示容器 -->
<div id="toast-container" class="toast-container"></div>

<!-- 主卡片容器（单栏布局） -->
<main class="login-card">
    <div class="login-right-panel">
        <div class="account-tabs">
            <div class="account-tab-btn active" id="btn-pwd-mode" onclick="switchAccountMode('password')">账号密码登录</div>
            <div class="account-tab-btn" id="btn-sms-mode" onclick="switchAccountMode('sms')">验证码登录</div>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="hidden" id="client_id" name="client_id" th:value="${clientId}" />
            <input type="hidden" id="redirect_uri" name="redirect_uri" th:value="${redirectUri}" />

            <div class="input-group">
                <input type="text" id="loginName" placeholder="请输入账号 / 手机号" autocomplete="username" required />
            </div>

            <div class="input-group" id="pwd-group">
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" />
            </div>

            <div class="input-group" id="validateCode-group" style="display: none;">
                <div class="sms-input-wrapper">
                    <input type="text" id="validateCode" placeholder="请输入验证码" autocomplete="off" />
                    <img id="validateCodeImg" onclick="refreshCheckCode();" height="38" style="cursor: pointer;" alt="验证码" />
                </div>
            </div>

            <div class="input-group" id="sms-group" style="display: none;">
                <div class="sms-input-wrapper">
                    <input type="text" id="sms-code" placeholder="请输入 6 位验证码" autocomplete="one-time-code" />
                    <button type="button" id="send-sms-btn" class="send-sms-btn" onclick="sendSmsCode()">获取验证码</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">登 录</button>
        </form>
    </div>
</main>

<footer class="footer">
    <p>版权所有 &copy; 2013-[[${#dates.format(new java.util.Date().getTime(), 'yyyy')}]] [[${T(com.eryansky.utils.AppConstants).getAppProductName()}]]</p>
</footer>

<script th:src="@{/static/js/jsencrypt/encrypt.all.min.js}" type="text/javascript"></script>
<script type="application/javascript" th:inline="javascript">
    const ctx = /*[[${ctx}]]*/ '';
    const ctxAdmin = /*[[${ctxAdmin}]]*/ '';
    let isValidateCodeLogin = /*[[${isValidateCodeLogin}]]*/ false;
    const securityToken = /*[[${securityToken}]]*/ '';
    const publicKey = /*[[${publicKey}]]*/ '';
    const requestEncrypt = /*[[${requestEncrypt}]]*/ '';

    let currentAccountMode = 'password';

    /* ------------------ Toast 提示组件 ------------------ */
    function showToast(message, type = 'info', duration = 3000) {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast-item toast-${type}`;
        const iconMap = { info: 'ℹ', success: '✓', warning: '!', error: '✕' };

        toast.innerHTML = `
                <div class="toast-icon">${iconMap[type] || 'ℹ'}</div>
                <div>${message}</div>
            `;

        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add('show'));

        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => {
                if (container.contains(toast)) container.removeChild(toast);
            }, 300);
        }, duration);
    }

    /* ------------------ 验证码与模式切换逻辑 ------------------ */
    function refreshCheckCode() {
        const validateCodeImg = document.getElementById("validateCodeImg");
        if (validateCodeImg) {
            validateCodeImg.src = `${ctx}/servlet/ValidateCodeServlet?_=${Date.now()}`;
        }
    }

    function updateValidateCodeVisibility() {
        const validateCodeGroup = document.getElementById('validateCode-group');
        const validateCodeInput = document.getElementById('validateCode');
        const shouldShow = (currentAccountMode === 'password') && Boolean(isValidateCodeLogin);

        if (validateCodeGroup) {
            validateCodeGroup.style.display = shouldShow ? 'block' : 'none';
        }
        if (validateCodeInput) {
            if (shouldShow) {
                refreshCheckCode();
                validateCodeInput.setAttribute('required', 'true');
            } else {
                validateCodeInput.removeAttribute('required');
                validateCodeInput.value = '';
            }
        }
    }

    function switchAccountMode(mode) {
        currentAccountMode = mode;
        const btnPwd = document.getElementById('btn-pwd-mode');
        const btnSms = document.getElementById('btn-sms-mode');
        const pwdGroup = document.getElementById('pwd-group');
        const smsGroup = document.getElementById('sms-group');
        const pwdInput = document.getElementById('password');
        const smsInput = document.getElementById('sms-code');

        if (mode === 'password') {
            btnPwd.classList.add('active');
            btnSms.classList.remove('active');
            pwdGroup.style.display = 'block';
            smsGroup.style.display = 'none';
            pwdInput.setAttribute('required', 'true');
            smsInput.removeAttribute('required');
        } else {
            btnSms.classList.add('active');
            btnPwd.classList.remove('active');
            pwdGroup.style.display = 'none';
            smsGroup.style.display = 'block';
            smsInput.setAttribute('required', 'true');
            pwdInput.removeAttribute('required');
        }
        updateValidateCodeVisibility();
    }

    /* ------------------ 发送短信与倒计时逻辑 ------------------ */
    async function sendSmsCode() {
        const loginName = document.getElementById('loginName').value.trim();
        const btnSms = document.getElementById('send-sms-btn');

        if (!loginName) {
            showToast('请输入账号/手机号', 'warning');
            return;
        }

        btnSms.disabled = true;

        try {
            const params = new URLSearchParams({ loginName });
            const response = await fetch(ctxAdmin + '/login/sendLoginSms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
            const data = await response.json();

            if (data.code === 1) {
                showToast(data.msg || '验证码发送成功', 'success');
                startSmsCountdown(btnSms, 60);
            } else {
                showToast(data.msg || '发送失败，请重试', 'error');
                btnSms.disabled = false;
            }
        } catch (error) {
            console.error('发送验证码错误:', error);
            showToast('网络连接异常，请稍后重试', 'error');
            btnSms.disabled = false;
        }
    }

    function startSmsCountdown(button, seconds) {
        let remain = seconds;
        button.innerText = `${remain}s 后重试`;

        const timer = setInterval(() => {
            remain--;
            if (remain > 0) {
                button.innerText = `${remain}s 后重试`;
            } else {
                clearInterval(timer);
                button.innerText = '获取验证码';
                button.disabled = false;
            }
        }, 1000);
    }

    /* ------------------ 统一表单提交逻辑 ------------------ */
    async function handleLogin(e) {
        e.preventDefault();

        const client_id = document.getElementById('client_id').value;
        const redirect_uri = document.getElementById('redirect_uri').value;
        const loginName = document.getElementById('loginName').value.trim();

        if (currentAccountMode === 'password') {
            let password = document.getElementById('password').value;
            const validateCodeDom = document.getElementById('validateCode');
            let encryptKey = '';
            let requestEncryptKey = '';

            if (requestEncrypt === "SM4") {
                encryptKey = Sm4Utils.generateSm4HexKey();
                requestEncryptKey = RSAUtils.encryptHexString(encryptKey, publicKey);
                password = Sm4Utils.encrypt(password, encryptKey);
            } else if (requestEncrypt === "AES") {
                encryptKey = Cryptos.generateAesBase64Key();
                requestEncryptKey = RSAUtils.encryptBase64String(encryptKey, publicKey);
                password = Cryptos.encrypt(password, encryptKey);
            }

            const params = new URLSearchParams({
                loginName,
                password,
                validateCode: validateCodeDom ? validateCodeDom.value.trim() : '',
                _csrf_token: securityToken,
                client_id,
                redirect_uri
            });

            try {
                const response = await fetch(ctxAdmin + "/login/login", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Encrypt': requestEncrypt,
                        'Encrypt-Key': requestEncryptKey
                    },
                    body: params
                });
                const data = await response.json();

                if (data.code === 1) {
                    window.location.href = data.obj?.url || ctxAdmin;
                } else if (data.code === 6) {
                    showToast(data.msg, 'error');
                    setTimeout(() => { window.location.href = data.obj?.url; }, 3000);
                } else {
                    showToast(data.msg, 'error');
                    if (data.obj === true) {
                        isValidateCodeLogin = true;
                        updateValidateCodeVisibility();
                    }
                }
            } catch (error) {
                console.error('密码登录错误:', error);
                showToast('登录服务响应失败，请检查网络后再试', 'error');
            }
        } else {
            const code = document.getElementById('sms-code').value.trim();
            const params = new URLSearchParams({
                loginName,
                code,
                _csrf_token: securityToken,
                client_id,
                redirect_uri
            });

            try {
                const response = await fetch(ctxAdmin + "/login/smsLogin", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });
                const data = await response.json();

                if (data.code === 1) {
                    window.location.href = data.obj || ctxAdmin;
                } else {
                    showToast(data.msg, 'error');
                }
            } catch (error) {
                console.error('验证码登录错误:', error);
                showToast('登录服务响应失败，请检查网络后再试', 'error');
            }
        }
    }

    // 页面初始化
    document.addEventListener('DOMContentLoaded', updateValidateCodeVisibility);
</script>
</body>
</html>
